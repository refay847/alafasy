name: alafasy
description: "Quran Alafasy Audio App"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  # Imported directly for MediaItem (was only a transitive dependency before).
  audio_service: ^0.18.0
  shared_preferences: ^2.5.3
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/audio/