name: alafasy
description: "Quran Alafasy Audio App"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  just_audio: ^0.10.6
  # Custom AudioHandler (notification with favorite / prev / play / next / close).
  # Replaces just_audio_background, which cannot add custom buttons.
  audio_service: ^0.18.18
  shared_preferences: ^2.5.3
  # Used to cache the generated notification artwork.
  path_provider: ^2.1.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generate the launcher icon and the native splash screen from assets/icon/.
  # Dev-only: they do not make the app bigger.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:

  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14110B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#14110B"
  image: assets/icon/splash_logo.png
  color_dark: "#14110B"
  image_dark: assets/icon/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#14110B"
    image: assets/icon/splash_logo_android12.png
    icon_background_color: "#14110B"
    color_dark: "#14110B"
    image_dark: assets/icon/splash_logo_android12.png
    icon_background_color_dark: "#14110B"